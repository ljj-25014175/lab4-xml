<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Catalogue</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 32px; color: #222; background: #fafafa; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
    table { border-collapse: collapse; min-width: 620px; background: #fff; }
    th, td { border: 1px solid #e5e7eb; padding: 10px 14px; text-align: left; }
    th { background: #f3f4f6; font-weight: 600; }
    tbody tr:hover { background: #f9fafb; }
    .price { text-align: right; font-variant-numeric: tabular-nums; }
    #status { margin-top: 14px; color: #b91c1c; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Book Catalogue</h1>
  <div class="sub">Data source: <code>book.xml</code> → fetch → DOMParser → DOM</div>

  <table id="books">
    <thead>
      <tr><th>ID</th><th>Title</th><th>Author</th><th class="price">Price</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="status"></div>

  <script>
    const statusEl = document.getElementById('status');
    const tbody = document.querySelector('#books tbody');

    async function loadBooks() {
      try {
        const response = await fetch('book.xml');
        if (!response.ok) {
          throw new Error('Fetch error: ' + response.status);
        }
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) {
          throw new Error('XML parse error: ' + parseError.textContent.trim());
        }
        const books = xmlDoc.querySelectorAll('book');
        if (books.length === 0) {
          statusEl.textContent = 'No <book> element found.';
          return;
        }
        books.forEach((book) => {
          const row = document.createElement('tr');
          const cells = [
            book.getAttribute('id') ?? '(no id)',
            book.querySelector('title')?.textContent.trim() ?? '',
            book.querySelector('author')?.textContent.trim() ?? '',
            book.querySelector('price')?.textContent.trim() ?? ''
          ];

          cells.forEach((value, i) => {
            const cell = document.createElement('td');
            if (i === 3) cell.className = 'price';
            cell.textContent = value;
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });
      } catch (err) {
        statusEl.textContent = '❌ ' + err.message;
      }
    }

    loadBooks();
  </script>
</body>
</html>
